description = "gpt-oss-120b split across both Sparks (TP=2 over Ray): same model as the baseline, to measure what the second node buys"
engine = "vllm"
nodes = 2
port = 8000

[vllm]
image = "nvcr.io/nvidia/vllm:26.05-py3"
model = "openai/gpt-oss-120b"
# The repo also carries original/ and metal/ copies of the weights (~130 GB).
download_exclude = ["original/*", "metal/*"]
args = [
  "--max-model-len", "131072",
  "--gpu-memory-utilization", "0.8",
  # Tool calls for agent harnesses (opencode, pi, dsh, Codex).
  "--enable-auto-tool-choice",
  "--tool-call-parser", "openai",
]

[bench]
prefill_tokens = [2048, 8192, 32768]
