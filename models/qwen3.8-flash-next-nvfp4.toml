description = "NVIDIA Qwen3.8-Flash-Next NVFP4 (~133 GB), vLLM TP=2 + expert parallel + MTP via MiaAI-Lab's two-Spark recipe"
engine = "launcher"
nodes = 2
port = 8000
served_name = "qwen3.8-flash-next"

[launcher]
repo = "https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks"
rev = "cd839d0b62f6c737178a0c2037733420e0524ebf"
env_template = ".env.sample"
# Downloads to the head, then rsyncs the worker's copy (~126 GiB each).
pull = "./start.sh --no-launch"
start = "./start.sh --launch"
stop = "./stop.sh"
# The recipe's own NFS server on the head; `down` removes it (see engines.py).
nfs_container = "vllm-fn-nfs"

[launcher.env]
HEAD_IP = "{head.cx7_ip}"
WORKER_IP = "{worker.cx7_ip}"
WORKER_USER = "{user}"
# Every model serves on 8000, so inference.json.lab (json-lab) has one backend.
PORT = "8000"
IFACE = "{cx7.netdev}"
IB_HCA = "={cx7.ibdev}"
IB_GID_INDEX = "{cx7.gid_index}"
# Upstream's default since 2026-09-26: 0.835 left <1 GiB available per node under load.
GPU_MEMORY_UTILIZATION = "0.80"

[bench]
prefill_tokens = [2048, 8192, 32768]
