description = "GLM-5.3-Flash, EXL3 4 bpw (~164 GiB + ~2.3 GiB DFlash2 drafter), TP=2 via MiaAI-Lab's two-Spark recipe"
# Same launcher family as deepseek-v4.1-flash-exl3 (start.sh/download.sh/.env).
engine = "launcher"
nodes = 2
port = 8000
served_name = "GLM-5.3-Flash-EXL3"

[launcher]
repo = "https://github.com/MiaAI-Lab/GLM-5.3-Flash-EXL3-2x-DGX-Sparks"
rev = "75a0e9e90b737729e1536a52ab4ea3c5085cf83b"
pull = "./download.sh"
start = "./start.sh"
stop = "./start.sh stop"
# The recipe's own NFS server on the head; `down` removes it (see engines.py).
nfs_container = "glm53-nfs"
logs = "./start.sh logs"

[launcher.env]
HEAD_IP = "{head.cx7_ip}"
WORKER_IP = "{worker.cx7_ip}"
WORKER_USER = "{user}"
# Every model serves on 8000, so inference.json.lab (json-lab) has one backend.
PORT = "8000"
HEAD_CX7_IF = "{cx7.netdev}"
WORKER_CX7_IF = "{cx7.netdev}"
HEAD_CX7_IB = "{cx7.ibdev}"
WORKER_CX7_IB = "{cx7.ibdev}"
NCCL_IB_GID_INDEX = "{cx7.gid_index}"
HEAD_GID = "{cx7.gid_index}"
WORKER_GID = "{cx7.gid_index}"

[bench]
prefill_tokens = [2048, 8192, 32768]
